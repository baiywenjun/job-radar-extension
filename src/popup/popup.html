<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>岗位雷达 · 本地岗位库</title>
<style>
  :root{
    --ink:#38291e;--ink2:#68503b;--ink3:#8b755f;--line:#f1dac1;--soft:#faecdc;
    --good:#1c7a4c;--goodbg:#eaf6ee;--goodline:#c6e6d2;
    --bad:#a3362f;--badbg:#fcecea;--badline:#f0cdc8;
    --accent:#e86b0a;--accentbg:#fff0df;--accentline:#ffc88c;
    --warn:#8a5a12;--warnbg:#fdf3e2;--warnline:#eeddb8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    width:800px;height:600px;display:flex;flex-direction:column;
    background:#fffaf5;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  header{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;background:linear-gradient(90deg,#fff0df,#fffaf5);border-top:4px solid var(--accent);border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.2px;color:#ab4600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
  .edition{font-size:10px;color:#a34400;background:#ffe2bd;border:1px solid #f9b56d;border-radius:999px;padding:1px 7px;letter-spacing:0}
  .brand em{font-style:normal;font-weight:400;color:var(--ink3);font-size:12px}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:12px}
  .hdr-right b{color:var(--accent);font-size:15px;font-variant-numeric:tabular-nums}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:12px 16px 0;flex:0 0 auto}
  .stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .k{font-size:11px;color:var(--ink3);margin-top:1px}
  .stat.g .v{color:var(--good)}
  .stat.b .v{color:var(--bad)}
  .stat.w .v{color:var(--warn)}
  .stat.n .v{color:var(--accent)}

  .bar{display:flex;gap:8px;align-items:center;padding:11px 16px;flex:0 0 auto}
  .bar input,.bar select{
    padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;
    font-size:12.5px;color:var(--ink);font-family:inherit;outline:none
  }
  .bar input{flex:1;min-width:120px}
  .bar input:focus,.bar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,107,10,.12)}
  .bar button{
    padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;
    color:var(--ink2);font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap
  }
  .bar button:hover{border-color:var(--accent);color:var(--accent)}
  .bar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .bar button.primary:hover{background:#bb5200;color:#fff}

  .tablewrap{flex:1 1 auto;overflow:auto;padding:0 16px 8px}
  table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;
    border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
  thead th{
    position:sticky;top:0;z-index:2;background:#fff0df;color:var(--ink2);font-weight:600;
    font-size:11.5px;text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap
  }
  tbody td{padding:7px 9px;border-bottom:1px solid var(--soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fff5e9}
  .sc{display:inline-block;min-width:32px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;
    padding:1px 5px;border-radius:4px;font-size:12px}
  .sc.strong{background:var(--goodbg);color:var(--good);border:1px solid var(--goodline)}
  .sc.neutral{background:var(--accentbg);color:var(--accent);border:1px solid var(--accentline)}
  .sc.weak{background:var(--warnbg);color:var(--warn);border:1px solid var(--warnline)}
  .sc.poor{background:var(--badbg);color:var(--bad);border:1px solid var(--badline)}
  .sc.insufficient,.sc.irrelevant{background:#f1f3f7;color:var(--ink3);border:1px solid var(--line)}
  .jt{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jt a{color:var(--ink);text-decoration:none;font-weight:600}
  .jt a:hover{color:var(--accent);text-decoration:underline}
  .co{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
  .sal{white-space:nowrap;color:var(--good);font-weight:600}
  .grp{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--accentbg);color:var(--accent);
    border:1px solid var(--accentline);white-space:nowrap}
  .days{white-space:nowrap;color:var(--ink3);font-variant-numeric:tabular-nums}
  .days.stale{color:var(--warn);font-weight:600}
  .del{border:none;background:transparent;color:#c3cad6;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:4px}
  .del:hover{background:var(--badbg);color:var(--bad)}
  .empty{padding:44px 20px;text-align:center;color:var(--ink3);font-size:13px;line-height:2}
  .empty b{color:var(--ink2)}
  .empty code{background:#fff0df;padding:1px 5px;border-radius:4px;font-size:12px}

  footer{flex:0 0 auto;padding:9px 16px 11px;border-top:1px solid var(--line);background:#fff6eb;
    color:var(--ink3);font-size:11px;line-height:1.6;display:flex;gap:12px;align-items:center}
  footer .sp{flex:1}
  footer button{border:1px solid var(--line);background:#fff;color:var(--ink3);font-size:11px;
    padding:4px 9px;border-radius:6px;cursor:pointer;font-family:inherit}
  footer button:hover{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span>岗位雷达<em>本地岗位库</em><span class="edition">白橙版 v0.1.5</span></div>
  <div class="hdr-right"><b id="total">0</b> 条记录</div>
</header>

<div class="stats" id="stats"></div>

<div class="bar">
  <input id="q" type="text" placeholder="搜索职位 / 公司 / 技术词，如 vLLM、FDE、世界模型" autocomplete="off">
  <select id="group"><option value="">全部族群</option></select>
  <select id="grade">
    <option value="">全部分档</option>
    <option value="strong">强信号</option>
    <option value="neutral">中性</option>
    <option value="weak">偏弱</option>
    <option value="poor">高概率伪岗</option>
    <option value="insufficient">信息不足</option>
    <option value="irrelevant">非目标岗位</option>
  </select>
  <button id="exportCsv" class="primary">导出 CSV</button>
  <button id="exportMd">导出 MD</button>
</div>

<div class="tablewrap">
  <table id="tbl">
    <thead>
      <tr>
        <th style="width:52px">评分</th>
        <th>职位</th>
        <th>公司</th>
        <th style="width:88px">薪资</th>
        <th style="width:62px">城市</th>
        <th style="width:82px">族群</th>
        <th style="width:62px">挂牌</th>
        <th style="width:34px"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">
    <b>还没有记录。</b><br>
    打开 BOSS 直聘 / 猎聘 / 脉脉 / 国聘 的岗位详情页，<br>
    在右侧面板点「保存到本地库」<code>即可入库</code>。
  </div>
</div>

<footer>
  <span>仅统计你实际浏览并保存的公开挂牌岗位，样本有偏，不代表全市场缺口。</span>
  <span class="sp"></span>
  <button id="clearAll">清空本地库</button>
</footer>

<script src="../common/util.js"></script>
<script src="../common/rules.js"></script>
<script src="../common/db.js"></script>
<script src="popup.js"></script>
</body>
</html>
