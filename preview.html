<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>岗位雷达 · 面板预览（自包含）</title>
<style>
  :root{--ink:#1e2532;--ink2:#4a5568;--ink3:#77839a;--line:#e2e7ef;--soft:#eef1f6;--blue:#20509b}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:#f5f7fa;color:var(--ink);padding:0 400px 40px 0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  .bar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);margin-bottom:22px;
    position:sticky;top:0;z-index:5;
  }
  .bar b{font-size:14px}
  .bar .hint{color:var(--ink3);font-size:12px}
  .btns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .btns button{
    padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;
    color:var(--ink2);font-size:12.5px;font-family:inherit;cursor:pointer
  }
  .btns button:hover{border-color:var(--blue);color:var(--blue)}
  .btns button.on{background:var(--blue);border-color:var(--blue);color:#fff}

  .fake{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:24px 26px 28px;max-width:700px;margin:0 auto;
  }
  .fake .job-banner{border-bottom:1px solid var(--soft);padding-bottom:14px;margin-bottom:16px}
  .fake .name h1{font-size:21px;margin:0 0 6px;font-weight:700;letter-spacing:.2px}
  .fake .salary{color:#fe574a;font-size:19px;font-weight:700;margin-bottom:8px}
  .fake .info-primary p{margin:0;color:var(--ink3);font-size:13px}
  .fake .company-info{margin-top:10px}
  .fake .company-info a.company-name{color:var(--blue);text-decoration:none;font-size:13.5px;font-weight:600}
  .fake .job-boss-info{margin:14px 0;color:var(--ink3);font-size:12.5px}
  .fake .job-sec-text{color:var(--ink2);font-size:13.5px;white-space:pre-line}
  .fake .job-sec-text strong{color:var(--ink)}
  .tip{
    max-width:700px;margin:18px auto 0;padding:12px 15px;background:#e9f0fc;
    border-left:3px solid var(--blue);border-radius:0 7px 7px 0;color:#33465e;font-size:12.5px;line-height:1.7;
  }
</style>
</head>
<body>

<div class="bar">
  <b>面板预览</b>
  <span class="hint">用假数据演示「抽取 → 打分 → 渲染」 · 本文件已内联全部脚本，可单独双击打开</span>
  <div class="btns" id="btns"></div>
</div>

<div id="fake" class="fake"></div>

<div class="tip">
  右侧面板就是插件在招聘详情页里注入的那一个，样式用 Shadow DOM 隔离，不会被站点 CSS 影响。<br>
  切换上方样本可以看到：强信号、中等、外包换名、收缩岗位分别得到什么分数与档位。
</div>

<script>
  /* 预览页没有扩展环境，这里给 chrome.runtime 打一个最小桩 */
  window.chrome = {
    runtime: {
      lastError: null,
      sendMessage: function (msg, cb) {
        if (!cb) return;
        setTimeout(function () {
          if (msg && msg.type === 'SAVE') {
            cb({ ok: true, record: { seenCount: 1, firstSeen: Date.now() } });
          } else {
            cb({ ok: true, record: null });
          }
        }, 40);
      }
    }
  };
</script>
<script>
/* 岗位雷达 · 通用工具
 * 内容脚本与 popup 共用，挂到 window.JR_UTIL。
 * 不依赖任何第三方库。
 */
(function (global) {
  'use strict';

  var CJK = /[\u4e00-\u9fa5]/;

  function clean(s) {
    return String(s == null ? '' : s)
      .replace(/\u00a0/g, ' ')
      .replace(/\u200b/g, '')
      .replace(/[ \t]+/g, ' ')
      .replace(/\r/g, '')
      .trim();
  }

  /* 归一化：去掉站点加的高亮标签残留、连续空白、全角括号差异，用于去重比对 */
  function squeeze(s) {
    return clean(s)
      .toLowerCase()
      .replace(/[\s\-_·•|/\\()（）\[\]【】「」,，.。:：]+/g, '');
  }

  /* FNV-1a 双通道，产出短 hash，用于生成记录主键 */
  function hash(str) {
    var s = String(str || '');
    var h1 = 0x811c9dc5;
    var h2 = 0x01000193;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      h1 ^= c;
      h1 = Math.imul(h1, 16777619) >>> 0;
      h2 = (Math.imul(h2 ^ c, 2246822507) + 0x9e3779b9) >>> 0;
    }
    return (h1.toString(36) + h2.toString(36)).slice(0, 12);
  }

  function isCJK(s) {
    return CJK.test(s);
  }

  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  /* 词条匹配器
   * - 中文词：允许内部空白差异（"PD 分离" 命中 "PD分离"）
   * - 英文词：加字母数字边界，"RAG" 不会命中 "storage"
   */
  function matcher(term) {
    var t = clean(term);
    if (!t) return null;
    var body = t.split(/\s+/).map(escapeRegExp).join('\\s*');
    var boundary = !isCJK(t);
    var re;
    try {
      re = new RegExp(
        (boundary ? '(?<![A-Za-z0-9])' : '') + body + (boundary ? '(?![A-Za-z0-9])' : ''),
        'i'
      );
    } catch (e) {
      try {
        re = new RegExp(body, 'i');
      } catch (e2) {
        return null;
      }
    }
    return {
      term: t,
      test: function (text) {
        return re.test(text);
      }
    };
  }

  /* 薪资解析：支持 30-60K·15薪 / 20k-40k / 15~25K / 8000-12000元/月 */
  function parseSalary(text) {
    var raw = clean(text);
    var out = { min: null, max: null, unit: '', raw: raw };
    if (!raw) return out;

    if (/面议|待定/.test(raw)) {
      out.unit = '面议';
      return out;
    }

    var m = raw.match(/(\d+(?:\.\d+)?)\s*[-~至]\s*(\d+(?:\.\d+)?)\s*(k|K|千|万)/);
    if (m) {
      var a = parseFloat(m[1]);
      var b = parseFloat(m[2]);
      var u = m[3].toLowerCase();
      if (u === '万') {
        a *= 10;
        b *= 10;
        out.unit = 'K';
      } else {
        out.unit = 'K';
      }
      out.min = a;
      out.max = b;
      return out;
    }

    m = raw.match(/(\d+(?:\.\d+)?)\s*(k|K|千)\s*(?:以上|\+)?/);
    if (m) {
      out.min = parseFloat(m[1]);
      out.max = parseFloat(m[1]);
      out.unit = 'K';
      return out;
    }

    m = raw.match(/(\d{4,6})\s*[-~至]\s*(\d{4,6})\s*元?/);
    if (m) {
      out.min = Math.round(parseFloat(m[1]) / 1000);
      out.max = Math.round(parseFloat(m[2]) / 1000);
      out.unit = 'K';
      return out;
    }

    return out;
  }

  /* 经验要求解析：返回 {min,max}，单位年；应届/不限返回 0 */
  function parseExperience(text) {
    var raw = clean(text);
    var out = { min: null, max: null, raw: raw };
    if (!raw) return out;
    if (/应届|在校|实习|经验不限|不限经验/.test(raw)) {
      out.min = 0;
      out.max = 0;
      return out;
    }
    var m = raw.match(/(\d+)\s*[-~至]\s*(\d+)\s*年/);
    if (m) {
      out.min = parseInt(m[1], 10);
      out.max = parseInt(m[2], 10);
      return out;
    }
    m = raw.match(/(\d+)\s*年(?:以上|\+)?/);
    if (m) {
      out.min = parseInt(m[1], 10);
      out.max = null;
      return out;
    }
    return out;
  }

  function daysBetween(tsFrom, tsTo) {
    if (!tsFrom) return 0;
    var to = tsTo || Date.now();
    return Math.max(0, Math.floor((to - tsFrom) / 86400000));
  }

  function pad(n) {
    return n < 10 ? '0' + n : String(n);
  }

  function fmtDate(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function fmtDateTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return fmtDate(ts) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function clamp(n, lo, hi) {
    return Math.max(lo, Math.min(hi, n));
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* 截断长文本，保留首尾，用于面板预览 */
  function ellipsis(s, n) {
    var t = clean(s);
    if (t.length <= n) return t;
    return t.slice(0, n) + '…';
  }

  function uniq(arr) {
    var seen = Object.create(null);
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var k = String(arr[i]);
      if (!seen[k]) {
        seen[k] = 1;
        out.push(arr[i]);
      }
    }
    return out;
  }

  global.JR_UTIL = {
    clean: clean,
    squeeze: squeeze,
    hash: hash,
    isCJK: isCJK,
    escapeRegExp: escapeRegExp,
    matcher: matcher,
    parseSalary: parseSalary,
    parseExperience: parseExperience,
    daysBetween: daysBetween,
    fmtDate: fmtDate,
    fmtDateTime: fmtDateTime,
    clamp: clamp,
    escapeHtml: escapeHtml,
    ellipsis: ellipsis,
    uniq: uniq
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 岗位雷达 · 规则库与打分引擎
 * 词库直接来自《热门紧缺岗位投递关键词速查表》，五类岗位族群 + 强/弱/排除信号词。
 * 设计原则：
 *   1. 证据不足不判伪——JD 太短时只标「信息不足」，不下结论。
 *   2. 排除词只看标题，不看正文——避免误伤正文里的正常职责描述。
 *   3. 每一条加减分都给出可读理由，分数必须能被人工复核。
 */
(function (global) {
  'use strict';

  var U = global.JR_UTIL;

  /* ---------- 五类岗位族群 ---------- */
  var GROUPS = [

      ],
      tech: [

        '场景交付', 'AI 应用交付', '政企交付', '部署工程师', 'AI 转型'
      ],
      tech: [

        '客户现场联调', '需求抽象', '操作手册', '续约扩容', '昇腾', 'CANN', 'Harness', '驻场'
      ]
    },
    {
      id: 'C',
      label: 'AI Infra / 推理优化 / HPC',
      short: 'AI Infra',
      title: [
        '推理优化', '推理引擎', '大模型推理', '算子开发', '模型部署', 'AI Infra',
        '高性能计算', 'HPC', 'GPU 调度', '智算', '推理加速', '算子加速', 'MLOps',
        'LLMOps', 'AI 编译器', '端侧 infra'
      ],
      tech: [
        'vLLM', 'SGLang', 'TensorRT-LLM', 'Triton', 'TGI', 'LMCache', 'CUDA',
        'Ascend C', 'CANN', 'PD 分离', 'KV Cache', 'Prefix Caching', 'Chunked Prefill',
        '投机解码', 'AWQ', 'GPTQ', 'FP8', 'INT4', 'MoE', 'NCCL', 'HCCL',
        'InfiniBand', 'RDMA', 'Ray Serve', 'Slurm', 'TTFT', 'TPOT', 'Prefill',
        'Decode', 'Profiling', 'FlashAttention', '算子融合', 'Megatron-LM',
        'DeepSpeed', 'verl', '单位 Token 成本', '有效吞吐'
      ]
    },
    {
      id: 'D',
      label: '智能驾驶 / 具身智能',
      short: '智驾具身',
      title: [
        '端到端', 'VLA', '世界模型', '规控', 'PNC', 'SLAM', '感知算法', 'BEV',
        '运动控制', '强化学习', '数据闭环', '闭环仿真', '自动驾驶', '智驾',
        '具身智能', '机器人', 'VLM', '三维重建', '自动标注', '灵巧手', 'VLN'
      ],
      tech: [
        'VLA', 'VLM', 'World Model', 'BEV', 'OCC', 'ORB-SLAM', 'VINS', 'MPC',
        'RRT', 'ROS2', 'Sim2Real', '闭环仿真', '三维渲染', 'TensorRT', 'Orin',
        'CLIP', 'BLIP', 'PPO', 'GRPO', 'AUTOSAR', 'SOME/IP', 'DDS', 'QNX',
        'EtherCAT', 'BSP', '功能安全', '车规级'
      ]
    },
    {
      id: 'E',
      label: '政企 / 国央企 / 私有化落地',
      short: '政企',
      title: [
        '人工智能岗', '政务 AI', '政务AI', '语料治理', '垂类智能体', 'AI 策略训练师',
        'AI策略训练师', '数智化', '国央企', '事业单位', '平台工程师岗'
      ],
      tech: [
        '私有化部署', '数据不出域', '数据不出省', '信创', '国产化适配', '鲲鹏',
        '麒麟', '昇腾', '等保', '分级权限', '日志审计', '语料治理', '标注标准',
        '知识库', 'Text2SQL', 'Text2Chart', '公文辅助', '政策解读', '上线验收', '驻场交付'
      ]
    }
  ];

  /* ---------- 建设动作与工程指标：代表「有预算、真在建设项目」 ---------- */
  var ACTION_TERMS = [
    '迁移', '替换', '重构', '从 0 到 1', '从0到1', '二次开发', '源码级',
    '自研', '建设', '改造', '调优', '压测', '灰度', '上线'
  ];

  var METRIC_TERMS = [
    'QPS', 'P99', '准确率', '召回率', '回归评测', 'eval', '监控告警',
    '故障兜底', 'SLA', 'A/B 测试', 'Token 预算', '模型分级路由', '成本优化'
  ];

  /* ---------- 弱信号：试点岗 / 伪岗位 / 外包 ---------- */
  var WEAK_TERMS = [
    { t: '熟悉 ChatGPT', w: -12, note: '只要求会用工具，非工程能力' },
    { t: '熟悉 Copilot', w: -10, note: '只要求会用工具' },
    { t: '提示词优化', w: -8, note: '纯提示词职责，已被工具替代' },
    { t: '提示词工程', w: -8, note: '纯提示词职责' },
    { t: 'Prompt 工程师', w: -14, note: '纯 Prompt 专职岗' },
    { t: '数据标注', w: -10, note: '标注类职责，非工程岗' },
    { t: '包就业', w: -30, note: '培训招生话术', flag: 'training' },
    { t: '零基础', w: -30, note: '培训招生话术', flag: 'training' },
    { t: '招生', w: -22, note: '疑似培训机构', flag: 'training' },
    { t: '培训生', w: -18, note: '培训性质', flag: 'training' },
    { t: '劳务派遣', w: -18, note: '劳务派遣，非甲方编制', flag: 'outsourcing' },
    { t: '人力外包', w: -18, note: '人力外包', flag: 'outsourcing' },
    { t: '人天', w: -12, note: '人天计价，按人头结算', flag: 'outsourcing' },
    { t: '外派', w: -12, note: '外派驻场', flag: 'outsourcing' }
  ];

  /* ---------- 反向排除词：正在收缩的岗位名，只看标题 ---------- */
  var EXCLUDE_TERMS = [
    '初级前端', '初级后端', '手工测试', '功能测试', '软件测试',
    'NLP 算法', '语音合成', '语音算法', '数据标注',
    'Prompt 工程师', '提示词工程师', '通用算法'
  ];

  /* ---------- 模型名堆砌检测 ---------- */
  var MODEL_TERMS = ['GPT', 'Claude', 'Llama', 'Qwen', 'DeepSeek', 'Gemini', '文心一言', '通义千问', '豆包'];

  /* 预编译匹配器 */
  var compiledGroups = GROUPS.map(function (g) {
    return {
      id: g.id,
      label: g.label,
      short: g.short,
      title: g.title.map(U.matcher).filter(Boolean),
      tech: g.tech.map(U.matcher).filter(Boolean)
    };
  });

  /* 全局技术词索引：term -> 归属族群集合 */
  var techIndex = [];
  (function buildTechIndex() {
    var seen = Object.create(null);
    compiledGroups.forEach(function (g) {
      g.tech.forEach(function (m) {
        if (seen[m.term]) {
          if (seen[m.term].indexOf(g.id) === -1) seen[m.term].push(g.id);
          return;
        }
        seen[m.term] = [g.id];
        techIndex.push({ matcher: m, groups: seen[m.term] });
      });
    });
  })();

  var compiledActions = ACTION_TERMS.map(U.matcher).filter(Boolean);
  var compiledMetrics = METRIC_TERMS.map(U.matcher).filter(Boolean);
  var compiledWeak = WEAK_TERMS.map(function (w) {
    var m = U.matcher(w.t);
    return m ? { matcher: m, w: w.w, note: w.note, flag: w.flag || null } : null;
  }).filter(Boolean);
  var compiledExclude = EXCLUDE_TERMS.map(U.matcher).filter(Boolean);
  var compiledModels = MODEL_TERMS.map(U.matcher).filter(Boolean);

  var GRADE_INFO = {
    strong: { label: '强信号', desc: '有具体技术栈与建设项目，值得优先投', level: 4 },
    neutral: { label: '中性', desc: '方向对得上，但证据不足以判断真假', level: 3 },
    weak: { label: '偏弱', desc: '信号偏弱或存在减分项，需人工核验', level: 2 },
    poor: { label: '高概率伪岗', desc: '命中多项减分项，建议直接跳过', level: 1 },
    insufficient: { label: '信息不足', desc: 'JD 太短或抽取失败，不下结论', level: 0 },
    irrelevant: { label: '非目标岗位', desc: '未命中任何目标族群词，可能是别类岗位', level: 0 }
  };

  /* 判定岗位族群：标题优先，其次 JD 前 800 字，最后技术词兜底。
   * 两轮分开算分，避免「标题命中数」与「技术词命中数」两个不同尺度的分数直接比较。
   */
  function detectGroup(jobTitle, jdText) {
    var title = U.clean(jobTitle);
    var head = U.clean(jdText).slice(0, 800);
    var best = null;
    var bestScore = 0;

    // 第一轮：标题命中（权重高），JD 开头命中（权重低）
    compiledGroups.forEach(function (g) {
      var s = 0;
      g.title.forEach(function (m) {
        if (title && m.test(title)) s += 3;
        else if (head && m.test(head)) s += 1;
      });
      if (s > bestScore) {
        bestScore = s;
        best = g;
      }
    });
    if (best && bestScore > 0) {
      return { id: best.id, label: best.label, short: best.short };
    }

    // 第二轮：标题没线索时，用 JD 里的技术词归属判断（至少命中 2 个才算）
    compiledGroups.forEach(function (g) {
      var ts = 0;
      g.tech.forEach(function (m) {

      // 一旦取不到就会抛错并被 catch 吞掉，静默退化为兜底逻辑。
      walker = document.createTreeWalker(document.body, 4, null);
    } catch (e) {
      return null;
    }
    var node;
    var guard = 0;
    while ((node = walker.nextNode()) && guard++ < 20000) {
      var t = node.nodeValue || '';
      if (!JD_KEY.test(t)) continue;
      var cur = node.parentElement;
      for (var i = 0; i < 8 && cur; i++) {
        var len = (cur.textContent || '').length;
        if (len >= 100 && len <= 20000) return cur;
        cur = cur.parentElement;
      }
      return node.parentElement;
    }
    return null;
  }

  function heuristicJD() {
    var anchor = findJdAnchor();
    if (anchor) {
      var at = nodeText(anchor);
      if (at.length >= 100) return { el: anchor, text: at };
    }

    var nodes = document.querySelectorAll('div, section, article, main');
    var best = null;
    var bestLen = 0;
    var limit = Math.min(nodes.length, 2000);

    for (var i = 0; i < limit; i++) {
      var el = nodes[i];
      if (!el || el.children.length > 30) continue;
      var raw = el.textContent || '';
      // 门槛定在 100 字：含「岗位职责/任职要求」这类关键词本身已是强信号，
      // 门槛过高会让篇幅较短的真实 JD 抽不到。
      if (raw.length < 100 || raw.length > 20000) continue;
      if (!JD_KEY.test(raw)) continue;
      if (raw.length > bestLen) {
        bestLen = raw.length;
        best = el;
      }
    }
    if (best) return { el: best, text: nodeText(best) };

    var main = document.querySelector('main, article, [class*="job-detail"], [class*="jobDetail"]');
    if (main) return { el: main, text: nodeText(main).slice(0, 20000) };
    return { el: null, text: '' };
  }

  /* 以 JD 容器为锚点向上爬，找到同时含薪资与经验的最小祖先，作为「详情区」。
     这样不必依赖具体类名：站点改版后类名换了，结构关系通常还在。
     上限 12000 字是为了防止一路爬到整页（那样会把左侧列表也圈进来）。 */
  function findDetailScope(anchorEl) {
    if (!anchorEl) return null;
    var el = anchorEl;
    for (var i = 0; i < 12; i++) {
      if (!el.parentElement) break;
      el = el.parentElement;
      var t = '';
      try {
        t = el.textContent || '';
      } catch (e) {
        break;
      }
      if (!t) continue;
      if (t.length > 12000) break;
      if (SALARY_RE.test(t) && EXP_RE.test(t)) return el;
    }
    return null;
  }

  /* 在根节点内找第一个「文本匹配正则」的叶子节点 */
  function findLeafText(root, re, maxLen) {
    if (!root) return null;
    var nodes = root.querySelectorAll('*');
    var limit = Math.min(nodes.length, 3000);
    for (var i = 0; i < limit; i++) {
      var el = nodes[i];
      if (el.children.length > 1) continue;
      if (looksLikeListItem(el)) continue;
      var t = U.clean(el.textContent);
      if (!t || t.length > maxLen) continue;
      var m = t.match(re);
      if (m) return { el: el, text: m[0] };
    }
    return null;
  }

  /* 详情区内的标题兜底：取第一个不像薪资/经验的标题元素 */
  function guessTitleIn(scope) {
    if (!scope) return '';
    var heads = scope.querySelectorAll('h1, h2, h3');
    for (var i = 0; i < heads.length; i++) {
      var t = U.clean(heads[i].textContent);
      if (!t || t.length < 2 || t.length > 60) continue;
      if (SALARY_RE.test(t) || EXP_RE.test(t)) continue;
      if (/岗位职责|职位描述|任职要求|公司介绍/.test(t)) continue;
      return sanitizeJobTitle(t);
    }
    return '';
  }

  /* 详情区内的公司名兜底：靠工商后缀识别，比类名稳 */
  function guessCompanyIn(scope) {
    if (!scope) return '';
    var nodes = scope.querySelectorAll('a, span, h3, h4, div');
    var limit = Math.min(nodes.length, 2500);
    for (var i = 0; i < limit; i++) {
      var el = nodes[i];
      if (el.children.length > 1) continue;
      var t = U.clean(el.textContent);
      if (!t || t.length < 4 || t.length > 30) continue;
      if (/有限公司|股份|集团|研究院|事务所|工作室|医院|学校|大学|银行|证券|保险|电子/.test(t)) {
        return sanitizeCompany(t);
      }
    }
    return '';
  }

  function extract(adapter) {
    if (!adapter) return null;
    var sel = adapter.selectors;
    var docTitle = document.title || '';
    var parsed = parseDocTitle(docTitle);

    /* ---- 第一步：先定位 JD，并以其为锚点圈定「详情区」 ----
       BOSS 搜索结果页是「左侧列表 + 右侧滑出详情」，两边的类名可能重复。
       全文档 querySelector 会抓到左侧卡片的职位名（实测抽成「FDE交付」，
       而那是左侧第三个列表项）。所以先拿 JD 元素，向上确定详情面板范围，
       后面所有字段都只在这个范围内找。 */
    var jdRes = pickText(sel.jd);
    var jdSource = jdRes.sel ? '选择器' : '未取到';
    if (!jdRes.text || jdRes.text.length < 120) {
      var h = heuristicJD();
      if (h.text && h.text.length > jdRes.text.length) {
        jdRes = { text: h.text, sel: null, el: h.el };
        jdSource = '启发式';
      }
    }
    var scope = findDetailScope(jdRes.el);
    var scopeTag = scope ? '选择器·区' : '选择器';

    /* ---- 第二步：逐字段抽取，优先限定在详情区内 ---- */
    var t = scope ? pickIn(scope, sel.jobTitle) : pickText(sel.jobTitle);
    var jobTitle = sanitizeJobTitle(t.text);
    var jobTitleSource = t.sel ? scopeTag : '';
    if (!jobTitle && scope) {
      jobTitle = guessTitleIn(scope);
      if (jobTitle) jobTitleSource = '结构推断';
    }
    if (!jobTitle) {
      jobTitle = sanitizeJobTitle(parsed.jobTitle);
      if (jobTitle) jobTitleSource = '标题推断';
    }
    if (!jobTitleSource) jobTitleSource = '未取到';

    var c = scope ? pickIn(scope, sel.company) : pickText(sel.company);
    var company = sanitizeCompany(c.text);
    var companySource = c.sel ? scopeTag : '';
    if (!company && scope) {
      company = guessCompanyIn(scope);
      if (company) companySource = '结构推断';
    }
    if (!company) {
      company = sanitizeCompany(parsed.company);
      if (company) companySource = '标题推断';
    }
    if (!companySource) companySource = '未取到';

    var sal = scope ? pickIn(scope, sel.salary) : pickText(sel.salary);
    var salaryText = SalClean(sal.text);
    var salarySource = sal.sel ? scopeTag : '';
    if (!salaryText && scope) {
      var salEl = findLeafText(scope, SALARY_RE, 24);
      if (salEl) {
        salaryText = salEl.text;
        salarySource = '结构推断';
      }
    }
    if (!salaryText && parsed.salary) {
      salaryText = parsed.salary;
      salarySource = '标题推断';
    }
    if (!salarySource) salarySource = '未取到';

    var meta = scope ? pickIn(scope, sel.meta) : pickText(sel.meta);
    var metaText = meta.text || '';

    var city = findCity(metaText);
    var citySource = city ? scopeTag : '';
    if (!city && scope) {
      var cityEl = findLeafText(scope, CITY_RE, 30);
      if (cityEl) {
        city = findCity(cityEl.text);
        if (city) citySource = '结构推断';
      }
    }
    if (!city && parsed.city) {
      city = parsed.city;
      citySource = '标题推断';
    }
    if (!citySource) citySource = '未取到';

    var experienceText = '';
    var expMatch = metaText.match(EXP_RE);
    if (expMatch) experienceText = expMatch[0];
    if (!experienceText && scope) {
      var expEl = findLeafText(scope, EXP_RE, 16);
      if (expEl) experienceText = expEl.text;
    }
    if (!experienceText && parsed.experience) experienceText = parsed.experience;

    var eduMatch = metaText.match(EDU_RE);
    if (!eduMatch && scope) {
      var eduEl = findLeafText(scope, EDU_RE, 8);
      if (eduEl) eduMatch = eduEl.text.match(EDU_RE);
    }

    var act = scope ? pickIn(scope, sel.active) : pickText(sel.active);
    var activeText = U.ellipsis(act.text, 40);

    var jdText = U.clean(jdRes.text).slice(0, 20000);

    if (!jobTitle && !company && !jdText) return null;

    return {
      platform: adapter.id,
      siteName: adapter.name,
      url: location.href,
      docTitle: docTitle,
      jobTitle: jobTitle,
      company: company,
      salaryText: salaryText,
      city: city,
      experienceText: experienceText,
      educationText: eduMatch ? eduMatch[0] : '',
      activeText: activeText,
      jdText: jdText,
      metaText: U.ellipsis(metaText, 80),
      sources: {
        jobTitle: jobTitleSource,
        company: companySource,
        salary: salarySource,
        city: citySource,
        jd: jdSource
      },
      extractedAt: Date.now()
    };
  }

  function SalClean(t) {
    var s = U.clean(t);
    var m = s.match(SALARY_RE);
    return m ? m[0] : (s.length <= 24 ? s : '');
  }

  global.JR_EXTRACT = {
    extract: extract,
    parseDocTitle: parseDocTitle,
    findCity: findCity,
    CITIES: CITIES
  };
})(typeof window !== 'undefined' ? window : globalThis);

  var host = null;

    if (host && document.documentElement.contains(host)) return;
    host = document.createElement('div');
    host.id = HOST_ID;
    host.style.cssText =
      'all:initial;position:fixed;top:88px;right:16px;z-index:2147483600;pointer-events:auto;display:none;';
    document.documentElement.appendChild(host);

    style.textContent = CSS;

    if (host) host.style.display = 'none';

    lastData = data;
    host.style.display = 'block';
    render();
  }

  /* 已识别站点但抽不到字段时的诊断态。

  function notice(title, lines) {

    host.style.display = 'block';
    lastData = null;
    var body = (lines || []).map(function (l) {
      return '<div class="jr-f"><span class="v">' + esc(l) + '</span></div>';
    }).join('');
    root.innerHTML =
      '<div class="jr-panel">' +
      '<div class="jr-head">' +
      '<div class="jr-brand"><span class="jr-dot"></span>岗位雷达</div>' +
      '<div class="jr-spacer"></div>' +
      '<button class="jr-icon" data-act="dismiss" title="关闭">×</button>' +
      '</div>' +
      '<div class="jr-body">' +
      '<div class="jr-note bad"><b>' + esc(title) + '</b></div>' +
      '<div class="jr-sec"><h4>诊断信息</h4><div class="jr-fields">' + body + '</div></div>' +
      '<div class="jr-note">这段提示只在「已识别站点、页面也像岗位详情、但字段全部抽不到」时出现，' +

  function gradeColor(grade) {
    switch (grade) {
      case 'strong': return '#1c7a4c';

      '<div class="jr-f">' +
      '<span class="k">' + esc(label) + '</span>' +
      '<span class="v' + (miss ? ' miss' : '') + '">' + (miss ? '未取到' : esc(value)) + '</span>' +
      srcBadge +

  function render() {

    var tags = [];

    tags.push('<span class="jr-tag n">' + esc(ev.groupShort || '未归类') + '</span>');

    if (ev.flags.indexOf('training') >= 0) tags.push('<span class="jr-tag b">培训招生</span>');
    if (ev.flags.indexOf('shrinking') >= 0) tags.push('<span class="jr-tag b">收缩岗位</span>');
    if (ev.flags.indexOf('salaryMismatch') >= 0) tags.push('<span class="jr-tag w">薪资倒挂</span>');

    if (ev.flags.indexOf('participateOnly') >= 0) tags.push('<span class="jr-tag w">职责模糊</span>');

      : '<span class="jr-empty">未命中具体技术栈词</span>';

    var actionChips = ''
      .concat(ev.actions.length ? ev.actions.map(function (x) { return '<span class="jr-chip n">' + esc(x.term) + '</span>'; }).join('') : '')
      .concat(ev.metrics.length ? ev.metrics.map(function (x) { return '<span class="jr-chip n">' + esc(x.term) + '</span>'; }).join('') : '');

      ? ev.weak.map(function (x) {

        }).join('')
      : '<span class="jr-empty">无减分项</span>';

    if (ev.excludes.length) {
      weakChips += ev.excludes.map(function (x) {
        return '<span class="jr-chip b">' + esc(x.term) + '（排除词）</span>';

    if (ev.grade === 'insufficient') {
      notes += '<div class="jr-note warn"><b>JD 仅 ' + ev.jdLength + ' 字</b>，抽取可能失败或岗位描述过短。证据不足不下结论，请确认页面是否加载完整，或点「重新抽取」。</div>';

      notes += '<div class="jr-note warn"><b>已连续挂牌 ' + d.staleDays + ' 天。</b>可能是高流动岗位持续招聘，也可能是僵尸岗；本项不扣分，仅供参考。</div>';

    var savedLabel = d.saved
      ? '更新记录 · 第 ' + d.seenCount + ' 次'

      '<div class="jr-head">' +

      '</div>' +
      '<div class="jr-body">' +
      '<div class="jr-score">' +

      '</div>' +
      '<div class="jr-tags">' + tags.join('') + '</div>' +
      '<div class="jr-fields">' +
      fieldRow('职位', f.jobTitle, src.jobTitle) +
      fieldRow('公司', f.company, src.company) +
      fieldRow('薪资', f.salaryText, src.salary) +
      fieldRow('城市', f.city, src.city) +
      fieldRow('经验', f.experienceText, f.experienceText ? '页面' : '未取到') +
      fieldRow('活跃', f.activeText, f.activeText ? '页面' : '未取到') +

      notes +
      '<div class="jr-sec"><h4>强信号 · 有预算的建设项目（' + ev.strong.length + '）</h4><div class="jr-chips">' + strongChips + '</div></div>' +
      '<div class="jr-sec"><h4>建设动作 / 工程指标</h4><div class="jr-chips">' + actionChips + '</div></div>' +

      '</div>' +

      '</div>';

  function bind() {
    // 事件绑定依赖 shadow root 已存在，所以先确保挂载，再做一次性绑定
    if (!shadow) mount();
    if (bound) return;
    bound = true;
    shadow.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
      if (!btn) return;
      var act = btn.getAttribute('data-act');
      if (act === 'toggle') {
        collapsed = !collapsed;
        render();
      } else if (act === 'dismiss') {
        hide();
      } else if (act === 'save' && handlers.onSave) {
        handlers.onSave(lastData);
      } else if (act === 'copy' && handlers.onCopy) {
        handlers.onCopy(lastData, btn);
      } else if (act === 're-extract' && handlers.onReextract) {
        handlers.onReextract();
      }
    });
  }

  function markSaved(record) {
    if (!lastData) return;
    lastData.saved = true;
    lastData.seenCount = record.seenCount || 1;
    lastData.staleDays = record.staleDays || 0;
    render();
  }

  global.JR_PANEL = {
    show: show,
    notice: notice,
    hide: hide,
    markSaved: markSaved,
    bind: bind,
    getData: function () { return lastData; }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
